<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f0e6" />
      <stop offset="100%" stop-color="#f3d7c4" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e07a45" />
      <stop offset="100%" stop-color="#a84322" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#a84322" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" 
        stroke="#c4522a" stroke-width="2" stroke-opacity="0.18" fill="none" />

  <!-- Outer Protective Hexagon Ring -->
  <polygon points="256,76 396,157 396,319 256,400 116,319 116,157" 
           fill="none" stroke="url(#blueGrad)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Modern Geometric Trade Emblem: Precision Hammer & Spark -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)">
    <!-- Hammer Handle -->
    <rect x="238" y="210" width="36" height="180" rx="12" fill="#E2E8F0" />
    <!-- Handle Grip Grooves -->
    <rect x="238" y="280" width="36" height="8" fill="#94A3B8" />
    <rect x="238" y="304" width="36" height="8" fill="#94A3B8" />
    <rect x="238" y="328" width="36" height="8" fill="#94A3B8" />
    <rect x="238" y="352" width="36" height="8" fill="#94A3B8" />

    <!-- Hammer Head Core -->
    <path d="M 160 148 L 330 148 C 342 148 352 158 352 170 L 352 200 C 352 212 342 222 330 222 L 160 222 C 148 222 138 212 138 200 L 138 170 C 138 158 148 148 160 148 Z" 
          fill="url(#blueGrad)" />

    <!-- Hardened Striking Face -->
    <rect x="342" y="142" width="24" height="86" rx="6" fill="#F8FAFC" />

    <!-- Precision Claw -->
    <path d="M 148 156 C 110 160 84 190 76 230 C 96 205 125 198 148 200 Z" fill="#94A3B8" />
  </g>

  <!-- AI Energy Spark (Amber Diamond) -->
  <polygon points="350,110 366,134 390,150 366,166 350,190 334,166 310,150 334,134" fill="url(#amberGrad)" />
</svg>
