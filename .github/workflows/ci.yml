name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./builderbot-app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: builderbot-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript & Production Build
        run: npm run build
